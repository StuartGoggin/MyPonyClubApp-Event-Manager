name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop]

jobs:
  quality-gates:
    name: Typecheck, lint and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      # Lint gate: blocking once the existing lint errors are cleaned up
      # (tracked as Phase 5 in Enhancements/SecurityHardeningPlan.md).
      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          # Placeholder values — build-time only, no secrets required.
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ci-placeholder
          NEXT_PUBLIC_APP_URL: http://localhost:9002
          NEXT_PUBLIC_BASE_URL: http://localhost:9002
